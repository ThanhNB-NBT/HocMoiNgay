# Phát hành: git tag v0.2.0 && git push origin v0.2.0
# → test, build APK release ký keystore cố định, tạo GitHub Release kèm APK.
# Secrets cần đặt (Settings → Secrets → Actions), cùng tên với Novel_Persona:
#   ANDROID_KEYSTORE_BASE64   keystore (alias "upload") mã hoá base64
#   ANDROID_KEYSTORE_PASSWORD mật khẩu keystore = mật khẩu key
#   SUPABASE_ANON_KEY         anon key của server production (hoc-api)
name: Release APK
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # tạo release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit test
        run: ./gradlew --console=plain :app:testDebugUnitTest
      - name: Giải keystore từ secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build APK release (ký keystore)
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_ANON_KEY" || { echo "Thiếu secret SUPABASE_ANON_KEY"; exit 1; }
          v="${GITHUB_REF_NAME#v}"
          ./gradlew --console=plain :app:assembleRelease -PversionName="$v" -PversionCode="${{ github.run_number }}"
          mv app/build/outputs/apk/release/app-release.apk "HocMoiNgay-$GITHUB_REF_NAME.apk"
      - name: Tạo GitHub Release kèm APK
        uses: softprops/action-gh-release@v3
        with:
          files: HocMoiNgay-*.apk
          generate_release_notes: true
